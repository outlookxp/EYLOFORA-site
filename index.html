<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EYLOFORA</title>
    <meta name="description" content="EYLOFORA official site.">
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f1e8;
        --fg: #231f1c;
        --muted: #6e6258;
        --line: #d9cbbc;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: linear-gradient(180deg, #fbf7f0 0%, var(--bg) 100%);
        color: var(--fg);
      }
      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 96px 24px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(42px, 8vw, 88px);
        letter-spacing: 0.04em;
      }
      p {
        margin: 0 0 16px;
        line-height: 1.7;
        color: var(--muted);
        font-size: 18px;
      }
      .card {
        margin-top: 40px;
        padding: 24px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.66);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>EYLOFORA</h1>
      <p>Official brand site and public product materials archive.</p>
      <div class="card">
        <p>Site initialization complete.</p>
        <p>Product pages, copyright statements, and publication records will be added here.</p>
      </div>
    </main>
  </body>
</html>
