name: Verify Live Site

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy GitHub Pages
    types:
      - completed

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify homepage and SEO files
        shell: bash
        run: |
          set -euo pipefail

          curl_args=(
            --fail
            --show-error
            --silent
            --location
            --retry 5
            --retry-delay 5
            --retry-all-errors
          )

          curl "${curl_args[@]}" https://eylofora.com/ --output homepage.html
          grep --fixed-strings '<title>EYLOFORA | Decorative Objects, Tabletop Pieces & Accessories</title>' homepage.html
          grep --fixed-strings 'Objects with character for everyday spaces.' homepage.html
          grep --fixed-strings 'eylofora887@gmail.com' homepage.html

          curl "${curl_args[@]}" https://eylofora.com/robots.txt --output robots.txt
          grep --fixed-strings 'Sitemap: https://eylofora.com/sitemap.xml' robots.txt

          curl "${curl_args[@]}" https://eylofora.com/sitemap.xml --output sitemap.xml
          grep --fixed-strings '<loc>https://eylofora.com/</loc>' sitemap.xml
          grep --fixed-strings '<loc>https://eylofora.com/privacy/</loc>' sitemap.xml
          if grep --fixed-strings '/products/' sitemap.xml; then
            echo 'Product pages must remain excluded from the sitemap while noindex is active.' >&2
            exit 1
          fi

          curl "${curl_args[@]}" https://eylofora.com/privacy/ --output privacy.html
          grep --fixed-strings '<title>Privacy Policy | EYLOFORA</title>' privacy.html

          for slug in cat-sculpture book-vase mahjong-rack-pusher; do
            curl "${curl_args[@]}" "https://eylofora.com/products/${slug}/" --output "product-${slug}.html"
            grep --fixed-strings '<meta name="robots" content="noindex, follow" />' "product-${slug}.html"
            grep --fixed-strings "<link rel=\"canonical\" href=\"https://eylofora.com/products/${slug}/\" />" "product-${slug}.html"
          done

      - name: Verify product image and redirects
        shell: bash
        run: |
          set -euo pipefail

          image_url='https://eylofora.com/assets/shangpin-web/book-vase/book-vase-standard/cover-01.webp'
          image_status=$(curl --fail --show-error --silent --location --retry 5 --retry-delay 5 --retry-all-errors --output /dev/null --write-out '%{http_code}' "$image_url")
          test "$image_status" = '200'

          final_url=$(curl --fail --show-error --silent --location --retry 5 --retry-delay 5 --retry-all-errors --output /dev/null --write-out '%{url_effective}' http://www.eylofora.com/)
          test "$final_url" = 'https://eylofora.com/'
